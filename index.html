<html lang="pt-BR">
<head>

  <style>
    :root {
      --bg-sidebar: #0f172a;
      --bg-sidebar-hover: #1e293b;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-white: #f8fafc;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --border: #e2e8f0;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
    }

    #auth-container {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
